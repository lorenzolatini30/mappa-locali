<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mappa Locali</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .locate-btn {
            position: absolute; bottom: 30px; right: 15px; z-index: 1000;
            background-color: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 50%;
            width: 50px; height: 50px; font-size: 24px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center;
        }
        .popup-content h3 { margin: 0 0 5px 0; font-size: 16px; }
        .popup-content p { margin: 3px 0; font-size: 14px; }
        .popup-content .categoria { color: #d97706; font-weight: bold; }
        .maps-link {
            display: inline-block; margin-top: 10px; padding: 8px 12px; background-color: #4285F4;
            color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="locate-btn" onclick="locateUser()" title="Trova la mia posizione">📍</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // Inizializza la mappa su Valencia
        const map = L.map('map').setView([39.4699, -0.3763], 13);

        // 1. ECCO IL TILE LAYER DI GOOGLE MAPS (Al posto di OpenStreetMap)
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google'
        }).addTo(map);

        let userMarker = null;
        function locateUser() {
            map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true});
        }

        map.on('locationfound', function(e) {
            if (!userMarker) {
                userMarker = L.circleMarker(e.latlng, {
                    radius: 8, fillColor: "#007AFF", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1
                }).addTo(map).bindPopup("Sei qui!");
            } else {
                userMarker.setLatLng(e.latlng);
            }
        });

        // 2. INCOLLA QUI SOTTO IL TUO LINK CSV (assicurati che finisca con "output=csv")
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCmlUkd4GCLA0OUIWM5PYtcNDgWi5UPUYnUNZPkZ7oHXF-m1SEDV2MLGM59XMaNYDaJu76Wvj2G3kW/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                
                data.forEach(locale => {
                    // 3. FIX VIRGOLA: Trasformiamo le eventuali virgole in punti prima di leggere il numero!
                    let latStr = locale.Lat ? locale.Lat.toString().replace(',', '.') : '';
                    let lonStr = locale.Lon ? locale.Lon.toString().replace(',', '.') : '';
                    
                    const lat = parseFloat(latStr);
                    const lon = parseFloat(lonStr);
                    
                    if (!isNaN(lat) && !isNaN(lon)) {
                        const mapsUrl = locale['Maps URL'] ? locale['Maps URL'] : `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                        
                        const popupHtml = `
                            <div class="popup-content">
                                <h3>${locale.Nome}</h3>
                                <p class="categoria">${locale.Categoria}</p>
                                <p><strong>Indirizzo:</strong> ${locale.Indirizzo}, ${locale['Città']}</p>
                                <p><strong>Note:</strong> ${locale.Note}</p>
                                <a href="${mapsUrl}" target="_blank" class="maps-link">Apri in Google Maps 🗺️</a>
                            </div>
                        `;

                        L.marker([lat, lon]).addTo(map).bindPopup(popupHtml);
                    }
                });
            }
        });
    </script>
</body>
</html>
